<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nossa Equipe</title>
<style>
:root{--bg:#f6f5fb;--card:#fff;--tx:#17142a;--mu:#6b6785;--ac:#6d4aff;--ac2:#ff4a8d;--bd:#e4e1f2;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f0d1a;--card:#1a1730;--tx:#f1effc;--mu:#a09cc0;--ac:#9b82ff;--ac2:#ff6fa5;--bd:#2c2850}}
:root[data-theme="dark"]{--bg:#0f0d1a;--card:#1a1730;--tx:#f1effc;--mu:#a09cc0;--ac:#9b82ff;--ac2:#ff6fa5;--bd:#2c2850}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
header{text-align:center;padding:64px 20px 32px}
header h1{font-size:clamp(2rem,6vw,3.4rem);margin:0 0 12px;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
header p{margin:0 auto;max-width:480px;color:var(--mu)}
main{max-width:1000px;margin:0 auto;padding:16px 20px 64px;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:28px 20px;text-align:center;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-4px);box-shadow:0 12px 30px rgba(109,74,255,.18)}
.av{position:relative;overflow:hidden;width:88px;height:88px;border-radius:50%;margin:0 auto 16px;display:grid;place-items:center;font-size:1.9rem;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--ac),var(--ac2))}
.av.tem-foto{background:none}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 25%}
.card h2{margin:0 0 4px;font-size:1.1rem}
.card .role{color:var(--mu);font-size:.9rem;margin-bottom:16px}
.card a{display:inline-block;padding:8px 18px;border-radius:999px;background:var(--ac);color:#fff;text-decoration:none;font-size:.9rem}
footer{text-align:center;color:var(--mu);padding:0 20px 40px;font-size:.85rem}
</style>
</head>
<body>
<header>
<h1>Nossa Equipe</h1>
<p>Conheça as pessoas que fazem tudo acontecer em nosso site.</p>
</header>
<main id="grid"></main>
<footer>© 2026 · Todos os direitos reservados</footer>
<script>
// Edite aqui: preencha "email", "cargo" e "foto" (ex.: "fotos/kaique.jpg") de cada integrante
var membros=[
{nome:"Kaique Fragoso",cargo:"Programador",email:"kaique.fragoso@soucosin.com.br",foto:"fotos/Kaique.jpg"},
{nome:"Ian Hikawa",cargo:"Pesquisador",email:"ian.hikawa@soucosin.com.br",foto:"fotos/Ian.jpg"},
{nome:"Nickolas Stathopolos",cargo:"Ajudante e Pesquisador",email:"nickolas.stathopolos@soucosin.com.br",foto:"fotos/Nickolas.jpg"},
{nome:"Cristhian José",cargo:"Ajudante",email:"cristhian.sjose@soucosin.com.br",foto:"fotos/Cristhian.jpg"},
{nome:"Marcos Vinicius",cargo:"Ajudante",email:"marcos.vinicius@soucosin.com.br",foto:"fotos/Marcos.jpg"},
{nome:"Gabriel Nicolas",cargo:"Pesquisador",email:"gabriel.nicolas@soucosin.com.br",foto:"fotos/Biel.jpg"}
];
var g=document.getElementById("grid");
membros.forEach(function(m){
var p=m.nome.split(" "),ini=(p[0][0]+p[p.length-1][0]).toUpperCase();
var c=document.createElement("div");c.className="card";
var av=document.createElement("div");av.className="av";av.textContent=ini;
if(m.foto){var im=document.createElement("img");im.alt=m.nome;im.src=m.foto;im.onload=function(){av.textContent="";av.classList.add("tem-foto");av.append(im);};}
var h=document.createElement("h2");h.textContent=m.nome;
var r=document.createElement("div");r.className="role";r.textContent=m.cargo;
c.append(av,h,r);
if(m.email){var a=document.createElement("a");a.href="mailto:"+m.email;a.textContent="Enviar e-mail";c.append(a);}
g.append(c);
});
</script>
</body>
</html>
